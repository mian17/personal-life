# A secret becomes public at the push that carries it, not at the deploy that uses
# it: this repository was private until now, so every commit still reachable in its
# history turns readable at the same instant the repository does. A key deleted in
# a later commit is still in the history, which is why the scan walks all of it —
# `fetch-depth: 0` below is the point of the job, not a default left alone. The
# output is redacted for the same reason: a scan that echoed the match would turn
# the private leak it found into a public one, in a log anyone can read.
name: Secrets

on:
  # Both lines: a `dev -> main` promotion is a real PR, and a secret that reached
  # `main` is the one that is already deployed.
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev]
  # Manual run, for a branch that has to be checked without opening a PR.
  workflow_dispatch:

# One run per PR, the same shape `tests.yml` uses: a new push supersedes the
# previous run, which is pointless to finish, and the group is keyed to the PR so
# one PR's run cannot cancel another's.
concurrency:
  group: secrets-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    # GitHub-hosted, like every other job in this repository: the scan needs
    # nothing from the owner's machine. Docker — for the pinned image below — is
    # preinstalled on `ubuntu-latest`.
    runs-on: ubuntu-latest
    # A full-history scan of this repository takes seconds. The ceiling is there
    # for a cold image pull, not because the scan is expected to be slow.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # Every commit, because every commit is what becomes public.
          fetch-depth: 0

      # The image is pinned by digest and never by tag: a tag can be moved to a
      # different image, and this step reads every byte of the history. The mount
      # is read-only — a scanner has no business writing into the checkout.
      # `.gitleaks.toml` extends the default rules with one path-narrowed
      # allowlist entry, explained there.
      - name: Scan history for secrets
        run: >-
          docker run --rm -v "$PWD:/repo:ro"
          ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          detect --source /repo --redact --no-banner --config /repo/.gitleaks.toml
