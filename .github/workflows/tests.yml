# The CI-based SonarCloud analysis for this repository. It runs on every pull
# request into `dev`/`main` and on every push to them, and it is the only
# analyser: Automatic Analysis must stay off for the scan step below to run. The
# local SonarQube container is now only the edit-time / pre-commit gate.
name: Tests

on:
  pull_request:
    # Both lines are listed because a `dev -> main` promotion is a real PR carrying
    # the same diff to the release line: listing only `dev` leaves that one PR — the
    # only one that reaches production — running zero checks. Verifying it here is
    # what makes the release line as tested as the integration line.
    branches: [dev, main]
  # One analysis per merge keeps the branch timeline current, and CI-based
  # analysis is the only mode that can ingest coverage — Automatic Analysis
  # cannot read `.coverage/lcov.info` at all.
  push:
    branches: [dev, main]
  # Manual run for reproducing a failure without pushing a commit.
  workflow_dispatch:

# One run per PR: a new push supersedes the previous one, which is pointless to
# finish. The group is keyed to the PR so runs for different PRs are independent
# of each other — on hosted runners there is no shared queue to contend for, and
# the per-PR group is what stops `cancel-in-progress` from killing another PR's
# run. It deliberately does not reuse `group: sonarqube`: that group serialises
# dev scans, so sharing it would let a dev-push scan cancel a PR run (and the
# reverse), burning both for no gain.
concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # GitHub-hosted runner: this job needs no SonarQube, no host-mounted service
    # and no self-hosted state. Docker — for the pg image pull below — is
    # preinstalled on `ubuntu-latest`.
    runs-on: ubuntu-latest
    # Estimate, not a measurement: a full `npm run test:coverage` across every
    # workspace, plus `npm ci` and the workspace build. Generous so a slow run is
    # not killed, tight enough that a hung suite cannot bill a full hour of
    # runner minutes.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # `--ignore-scripts` on purpose: Sonar rule S6505 flags installing with
      # package-manager scripts enabled (githubactions:S6505, MAJOR), which is
      # exactly what `npm ci` alone does. Only three dependencies carry install
      # scripts, and only the two native ones matter here: `better-sqlite3`
      # (sqlite suites) and `argon2` (idp). Rebuild those explicitly; `fsevents`
      # is macOS-only and optional.

      # No `.npmrc` is committed on purpose: `replace-registry-host: always` rewrites the
      # lockfile's mirror `resolved` hosts to the pinned registry in CI only, leaving local
      # npm alone; the fetch flags turn a flaky mirror into bounded retries, and
      # `--no-audit --no-fund` drop two round-trips (`audit:gate` gates advisories below).
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund --fetch-retries=5 --fetch-retry-mintimeout=10000 --fetch-retry-maxtimeout=60000 --fetch-timeout=300000
        env:
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
          NPM_CONFIG_REPLACE_REGISTRY_HOST: always

      # Blocking on purpose, and straight after install: the gate reads the
      # lockfile and node_modules, nothing built. A plain `npm audit
      # --audit-level=high` cannot be this step — the tree already carries known
      # production advisories pending upgrades, so it would be red from day one.
      # `scripts/audit-gate.mjs` fails on a high/critical advisory that is not on
      # the checked-in allowlist, on an allowlist entry audit no longer reports
      # (delete the exception), and on a critical entry past its `reviewBy` date.
      - name: Audit production dependencies
        run: npm run audit:gate

      # Lint is the cheapest gate in the job and needs no compiled output and no
      # native modules, so it runs straight after install: a style error fails the
      # job in seconds instead of after a multi-minute native rebuild and
      # workspace build.
      - name: Lint
        run: npm run lint

      # Prettier ratchet. The tree was never formatted — 408 of 1067 tracked
      # files fail `npm run format:check` on dev, and no printWidth fixes that
      # (80 -> 710, 120 -> 518), so a whole-tree gate would fail every PR and a
      # one-off reformat would bury `git log --follow` across a third of the
      # repo. Only the files this PR changes are checked: new drift is stopped,
      # the existing drift is left untouched.
      #
      # `.prettierignore` is not re-implemented here: prettier applies it to
      # explicitly listed files too, so a path it ignores (package-lock.json,
      # docs/**, dist/, …) is dropped from the list instead of being checked.
      # Cheap and build-free, hence above `Build workspaces`.
      #
      # The diff is three-dot — `BASE_SHA...HEAD` — so it compares against the
      # MERGE BASE, not against the base branch tip. `pull_request.base.sha` is
      # the tip of `dev` at the time of the event, so on a branch that has not
      # merged `dev` back in (every Dependabot branch) a two-dot diff also
      # contains `dev`'s own newer commits, reversed: measured on
      # `dependabot/npm_and_yarn/npm-minor-patch-4e81ebb20d`, two-dot listed 22
      # files under this filter (24 unfiltered) including
      # `.github/workflows/tests.yml` and the root `package.json`, which that PR
      # never touched, while three-dot lists the 20 it does change. Blaming a PR
      # for files it never touched is a failure it cannot fix — a bot cannot run
      # prettier on `dev`.
      - name: Check formatting (changed files only)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "Not a pull request run; skipping the changed-file format check."
            exit 0
          fi
          files=$(git diff --name-only --diff-filter=ACMR "$BASE_SHA"...HEAD \
            | grep -E '\.(ts|tsx|js|jsx|mjs|cjs|json|css|md|ya?ml)$' || true)
          if [ -z "$files" ]; then
            echo "No prettier-owned files changed; nothing to check."
            exit 0
          fi
          echo "$files"
          npx prettier --check $files

      - name: Build native dependencies
        run: npm rebuild better-sqlite3 argon2

      # Next prints "No build cache found" from `getCacheDir()` whenever CI is set
      # and `apps/app/.next/cache` does not exist — it has no config switch, so the
      # only fix is to make a real cache present. The key carries the commit and
      # the lockfile hash: an exact-key hit restores this commit's own cache, and
      # the narrow restore prefix lets a same-lockfile commit warm the build
      # without ever crossing a dependency change. Residual risk: a warm hit from
      # a different commit could in principle restore stale Turbopack entries, but
      # Next hashes module contents into its cache keys, so stale output is not
      # served. A cold key (first run after a lockfile bump) still warns — nothing
      # exists to restore, and pre-creating an empty dir would only hide that.
      - name: Restore Next build cache
        uses: actions/cache@v6
        with:
          path: apps/app/.next/cache
          key: ${{ runner.os }}-next-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: ${{ runner.os }}-next-${{ hashFiles('package-lock.json') }}-

      # Workspace `@life/*` types only exist after a build: a fresh clone has no
      # `dist/`, so every suite importing another workspace fails with TS2307.
      - name: Build workspaces
        run: npm run build

      # Typecheck sits here on purpose, on both sides. After `Build workspaces`
      # because `@life/*` types only exist once `dist/` is built — run on a fresh
      # clone it fails with TS2307, not with a real type error. Before the test
      # suite because a type error should fail in seconds, not after a full
      # coverage run.
      - name: Typecheck
        run: npm run typecheck

      # Architecture rules that a static read can prove (`scripts/arch-check.mjs`):
      # one database per service, the designated engine, no cross-service store
      # access, and every variable a service cannot boot without forwarded in
      # compose.yaml. Build-free and reads `compose.yaml` plus sources, so it runs
      # here in seconds — before the coverage run, whose suites take minutes. This
      # is the only gate that reads compose.yaml: three production features shipped
      # dead on 2026-11-14 (`MEAL_*_API_URL`, `FOCUS_*_API_URL`,
      # `OIDC_PRODUCER_*`) because nothing in CI compared the code with the file.
      - name: Architecture rules
        run: npm run arch:check

      # Suites that boot a sqlite service need a writable data directory, and
      # those directories are gitignored, so a fresh checkout has none.
      - name: Prepare test data directories
        run: mkdir -p apps/{idp,meal-service,note-service,tags-service,todo-service}/data

      # The pg integration suite runs against a throwaway `postgres:17-alpine`
      # container. Pulling the image here keeps the registry fetch out of the
      # jest hook: a cold pull inside it would park the event loop under the
      # suite's own timeout and surface as a silent hook timeout, not a fetch
      # error.
      - name: Pull Postgres test image
        timeout-minutes: 10
        run: docker pull postgres:17-alpine

      # The repo's single coverage engine: `scripts/coverage.mjs` fans out over
      # every workspace and writes `.coverage/lcov.info`. Invoked through the
      # script, never re-spelled here, so PR and dev-push runs share one runner
      # of truth. A failing suite fails the job, which is the entire point.
      - name: Test with coverage
        run: npm run test:coverage

      # A missing or empty report must fail here, not publish a silent 0.0%. The
      # scanner treats an absent `sonar.javascript.lcov.reportPaths` file as "no
      # coverage data", not as an error, so the quality gate would go green on the
      # strength of lines nobody measured.
      - name: Check coverage report exists
        run: |
          if [ ! -s .coverage/lcov.info ]; then
            echo "::error::.coverage/lcov.info is missing or empty. The scan would" \
              "publish 0.0% coverage for every file. Fix the coverage run before" \
              "retrying; do not skip this step."
            exit 1
          fi

      # The analysis itself. Automatic Analysis (the GitHub App) must be OFF in
      # SonarCloud, otherwise this step fails: the scanner refuses to run against
      # a project whose automatic analysis is enabled. `SONAR_TOKEN` is a Cloud
      # token, not the retired local-server one. The project key is overridden on
      # the command line because the checked-in `sonar-project.properties` carries
      # the LOCAL container's key, which the edit-time gate matches literally.
      - name: SonarCloud scan
        uses: SonarSource/sonarqube-scan-action@70bad232163b09d998ea0707ee80c0ec80798c16 # v8.5.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          args: -Dsonar.projectKey=mian17_personal-life -Dsonar.organization=mian17
