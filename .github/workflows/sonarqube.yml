# A content-neutral merge commit (two or more parents, tree identical to its
# first parent — the shape `merge -s ours` back-merges produce) is skipped:
# there is no diff to analyse, and the full `npm ci` + build + coverage run it
# would burn has already OOM-killed this host once.
name: SonarQube

on:
  push:
    # `main` is the release line and is not scanned: work lands on `dev` and is
    # already analysed there, so scanning the promotion again only duplicates it.
    branches: [dev]
  workflow_dispatch:

# Community Build stores one analysis per project, so two overlapping scans would
# race to overwrite it. Serialise them; the last push wins.
concurrency:
  group: sonarqube
  cancel-in-progress: false

jobs:
  scan:
    # Self-hosted runner on the same host as the SonarQube container,
    # so http://127.0.0.1:9000 is reachable without exposing the instance.
    runs-on: [self-hosted, sonarqube]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Detect the skip by tree comparison, not commit-message text: the message
      # is not reliable once the back-merge PR is merged ("Merge pull request
      # #N from ..."). A root or single-parent commit leaves `parent` empty and
      # cannot trip the guard.
      - name: Skip content-neutral merge
        id: guard
        run: |
          parent="$(git rev-parse HEAD^1 2>/dev/null || true)"
          if [ -n "$parent" ] && git diff --quiet "$parent" HEAD; then
            echo "HEAD is a content-neutral merge (tree identical to its first parent): skipping scan."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Ensure SonarQube is up
        if: steps.guard.outputs.skip != 'true'
        run: /home/night/WebstormProjects/sonarqube/ensure-up.sh

      - uses: actions/setup-node@v7
        if: steps.guard.outputs.skip != 'true'
        with:
          node-version: 24
          cache: npm

      # `--ignore-scripts` on purpose: Sonar rule S6505 flags installing with
      # package-manager scripts enabled (githubactions:S6505, MAJOR), which is
      # exactly what `npm ci` alone does — it failed the PR's quality gate at
      # rating C. Only three dependencies carry install scripts, and only the two
      # native ones matter here: `better-sqlite3` (sqlite suites) and `argon2`
      # (idp). Rebuild those explicitly; `fsevents` is macOS-only and optional.
      - name: Install dependencies
        if: steps.guard.outputs.skip != 'true'
        run: npm ci --ignore-scripts

      - name: Build native dependencies
        if: steps.guard.outputs.skip != 'true'
        run: npm rebuild better-sqlite3 argon2

      # Workspace `@life/*` types only exist after a build: a fresh clone has no
      # `dist/`, so every suite importing another workspace fails with TS2307
      # (measured: 13/13 note-service suites red). `dist/` is in
      # `sonar.exclusions` and dropped by the coverage merge, so building first
      # adds no scan noise.
      - name: Build workspaces
        if: steps.guard.outputs.skip != 'true'
        run: npm run build

      # Suites that boot a sqlite service need a writable data directory, and
      # those directories are gitignored, so a fresh checkout has none.
      - name: Prepare test data directories
        if: steps.guard.outputs.skip != 'true'
        run: mkdir -p apps/{idp,meal-service,note-service,tags-service,todo-service}/data

      # The pg integration suite runs against a throwaway `postgres:17-alpine`
      # container. Pulling the image here keeps the registry fetch out of the
      # jest hook: a cold pull inside it would park the event loop under the
      # suite's own timeout and surface as a silent hook timeout, not a fetch
      # error. A failed pull fails this step with the registry's message.
      - name: Pull Postgres test image
        if: steps.guard.outputs.skip != 'true'
        timeout-minutes: 10
        run: docker pull postgres:17-alpine

      # Produces `.coverage/lcov.info`, the report the scan step below ingests -
      # without it every line counts as uncovered, which is why the project read
      # 0.0% for so long. A failing suite fails the job on purpose: scanning a
      # stale or partial report silently understates coverage.
      - name: Test with coverage
        if: steps.guard.outputs.skip != 'true'
        run: npm run test:coverage

      - name: SonarQube scan
        if: steps.guard.outputs.skip != 'true'
        uses: SonarSource/sonarqube-scan-action@v8.4.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: http://127.0.0.1:9000

      # The scan only UPLOADS a report; it never reads the resulting gate, so
      # this job stayed green even when the gate was ERROR. Read the gate here
      # and fail on it, which turns "gate OK" into a checkable fact instead of
      # an assumption.
      - name: Wait for the quality gate
        if: steps.guard.outputs.skip != 'true'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: http://127.0.0.1:9000
        run: |
          # The compute engine finishes asynchronously after the upload, so an
          # early poll still sees the previous analysis. Bounded on purpose:
          # 30 attempts 5s apart is 150s, then the job fails loudly instead of
          # hanging the serialised `concurrency` group forever.
          report=""
          for attempt in $(seq 1 30); do
            # Token travels in the header only - never in the URL, never echoed.
            # `node` is guaranteed here (setup-node runs above); `jq` is not.
            # Parse defensively: an HTTP error body carries no projectStatus, so
            # a parse failure counts as a failed poll rather than a crash.
            report="$(curl --silent --show-error \
              --header "Authorization: Bearer ${SONAR_TOKEN}" \
              "${SONAR_HOST_URL}/api/qualitygates/project_status?projectKey=personal-life" || true)"
            status="$(printf '%s' "$report" | node -e '
              let body = "";
              process.stdin.on("data", (chunk) => (body += chunk)).on("end", () => {
                try {
                  console.log(JSON.parse(body).projectStatus.status);
                } catch {
                  console.log("UNREACHABLE");
                }
              });
            ')"
            if [ "$status" = "OK" ]; then
              echo "Quality gate is OK."
              exit 0
            fi
            echo "Quality gate is ${status} (attempt ${attempt}/30)."
            if [ "$attempt" -lt 30 ]; then
              echo "Retrying in 5s."
              sleep 5
            fi
          done

          # Status plus every non-OK condition, so the failure is actionable
          # without hand-querying the API.
          printf '%s' "$report" | node -e '
            let body = "";
            process.stdin.on("data", (chunk) => (body += chunk)).on("end", () => {
              let gate;
              try {
                gate = JSON.parse(body).projectStatus;
              } catch {
                console.error("Unexpected response from the quality gate API.");
                process.exit(1);
              }
              console.error(`Quality gate did not pass: ${gate.status}`);
              for (const condition of gate.conditions ?? []) {
                if (condition.status === "OK") continue;
                console.error(
                  `  ${condition.status} ${condition.metricKey}: actual ${condition.actualValue}, required ${condition.errorThreshold}`,
                );
              }
              process.exit(1);
            });
          '

          # A failing metric name is not actionable on its own: "new_violations:
          # actual 13" says nothing about which 13. List the offending issues
          # too. Best effort on purpose - an HTTP error or a non-JSON body here
          # must not hide the gate verdict printed above, so it notes the
          # problem and the step still exits 1.
          issues="$(curl --silent --show-error \
            --header "Authorization: Bearer ${SONAR_TOKEN}" \
            "${SONAR_HOST_URL}/api/issues/search?componentKeys=personal-life&resolved=false&inNewCodePeriod=true&ps=100&facets=severities" || true)"
          printf '%s' "$issues" | node -e '
            let body = "";
            process.stdin.on("data", (chunk) => (body += chunk)).on("end", () => {
              let result;
              try {
                result = JSON.parse(body);
              } catch {
                console.error("Could not read the issues API response; see the gate conditions above.");
                return;
              }
              if (!Array.isArray(result.issues)) {
                console.error("Unexpected response from the issues API; see the gate conditions above.");
                return;
              }
              const issues = result.issues;
              const total = result.total ?? issues.length;
              if (issues.length === 0) {
                console.error("The issues API returned no issues for the new code period.");
                return;
              }
              console.error(`Offending issues (${issues.length} of ${total}):`);
              for (const issue of issues) {
                const component = (issue.component ?? "").replace(/^personal-life:/, "");
                console.error(
                  `  ${issue.severity} ${issue.rule} ${component}:${issue.line ?? "-"} ${issue.message}`,
                );
              }
              if (total > issues.length) {
                console.error(`  ...and ${total - issues.length} more (page size 100).`);
              }
            });
          '
          exit 1
