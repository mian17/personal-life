name: SonarQube

on:
  push:
    # `main` is the release line and is not scanned: work lands on `dev` and is
    # already analysed there, so scanning the promotion again only duplicates it.
    branches: [dev]
  workflow_dispatch:

# Community Build stores one analysis per project, so two overlapping scans would
# race to overwrite it. Serialise them; the last push wins.
concurrency:
  group: sonarqube
  cancel-in-progress: false

jobs:
  scan:
    # Self-hosted runner on the same host as the SonarQube container,
    # so http://127.0.0.1:9000 is reachable without exposing the instance.
    runs-on: [self-hosted, sonarqube]
    steps:
      - name: Ensure SonarQube is up
        run: /home/night/WebstormProjects/sonarqube/ensure-up.sh

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Suites that boot a sqlite service need a writable data directory, and
      # those directories are gitignored, so a fresh checkout has none.
      - name: Prepare test data directories
        run: mkdir -p apps/{idp,meal-service,note-service,tags-service,todo-service}/data

      # Produces `.coverage/lcov.info`, the report the scan step below ingests -
      # without it every line counts as uncovered, which is why the project read
      # 0.0% for so long. A failing suite fails the job on purpose: scanning a
      # stale or partial report silently understates coverage.
      - name: Test with coverage
        run: npm run test:coverage

      - name: SonarQube scan
        uses: SonarSource/sonarqube-scan-action@v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: http://127.0.0.1:9000
