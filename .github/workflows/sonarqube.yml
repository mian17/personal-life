# A content-neutral merge commit (two or more parents, tree identical to its
# first parent — the shape `merge -s ours` back-merges produce) is skipped:
# there is no diff to analyse, and the full `npm ci` + build + coverage run it
# would burn has already OOM-killed this host once.
name: SonarQube

on:
  push:
    # `main` is the release line and is not scanned: work lands on `dev` and is
    # already analysed there, so scanning the promotion again only duplicates it.
    branches: [dev]
  workflow_dispatch:

# Community Build stores one analysis per project, so two overlapping scans would
# race to overwrite it. Serialise them; the last push wins.
concurrency:
  group: sonarqube
  cancel-in-progress: false

jobs:
  scan:
    # Self-hosted runner on the same host as the SonarQube container,
    # so http://127.0.0.1:9000 is reachable without exposing the instance.
    runs-on: [self-hosted, sonarqube]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Detect the skip by tree comparison, not commit-message text: the message
      # is not reliable once the back-merge PR is merged ("Merge pull request
      # #N from ..."). A root or single-parent commit leaves `parent` empty and
      # cannot trip the guard.
      - name: Skip content-neutral merge
        id: guard
        run: |
          parent="$(git rev-parse HEAD^1 2>/dev/null || true)"
          if [ -n "$parent" ] && git diff --quiet "$parent" HEAD; then
            echo "HEAD is a content-neutral merge (tree identical to its first parent): skipping scan."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Ensure SonarQube is up
        if: steps.guard.outputs.skip != 'true'
        run: /home/night/WebstormProjects/sonarqube/ensure-up.sh

      - uses: actions/setup-node@v7
        if: steps.guard.outputs.skip != 'true'
        with:
          node-version: 22
          cache: npm

      # `--ignore-scripts` on purpose: Sonar rule S6505 flags installing with
      # package-manager scripts enabled (githubactions:S6505, MAJOR), which is
      # exactly what `npm ci` alone does — it failed the PR's quality gate at
      # rating C. Only three dependencies carry install scripts, and only the two
      # native ones matter here: `better-sqlite3` (sqlite suites) and `argon2`
      # (idp). Rebuild those explicitly; `fsevents` is macOS-only and optional.
      - name: Install dependencies
        if: steps.guard.outputs.skip != 'true'
        run: npm ci --ignore-scripts

      - name: Build native dependencies
        if: steps.guard.outputs.skip != 'true'
        run: npm rebuild better-sqlite3 argon2

      # Workspace `@life/*` types only exist after a build: a fresh clone has no
      # `dist/`, so every suite importing another workspace fails with TS2307
      # (measured: 13/13 note-service suites red). `dist/` is in
      # `sonar.exclusions` and dropped by the coverage merge, so building first
      # adds no scan noise.
      - name: Build workspaces
        if: steps.guard.outputs.skip != 'true'
        run: npm run build

      # Suites that boot a sqlite service need a writable data directory, and
      # those directories are gitignored, so a fresh checkout has none.
      - name: Prepare test data directories
        if: steps.guard.outputs.skip != 'true'
        run: mkdir -p apps/{idp,meal-service,note-service,tags-service,todo-service}/data

      # The pg integration suite runs against a throwaway `postgres:17-alpine`
      # container. Pulling the image here keeps the registry fetch out of the
      # jest hook: a cold pull inside it would park the event loop under the
      # suite's own timeout and surface as a silent hook timeout, not a fetch
      # error. A failed pull fails this step with the registry's message.
      - name: Pull Postgres test image
        if: steps.guard.outputs.skip != 'true'
        timeout-minutes: 10
        run: docker pull postgres:17-alpine

      # Produces `.coverage/lcov.info`, the report the scan step below ingests -
      # without it every line counts as uncovered, which is why the project read
      # 0.0% for so long. A failing suite fails the job on purpose: scanning a
      # stale or partial report silently understates coverage.
      - name: Test with coverage
        if: steps.guard.outputs.skip != 'true'
        run: npm run test:coverage

      - name: SonarQube scan
        if: steps.guard.outputs.skip != 'true'
        uses: SonarSource/sonarqube-scan-action@v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: http://127.0.0.1:9000
