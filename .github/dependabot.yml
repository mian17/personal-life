# Version updates are deliberately disabled: a pull-request limit of zero turns the
# scheduled bump engine off for both ecosystems. Do not raise it. Routine PRs from
# this file carried no CVE and only added review load.
#
# Dependabot *security* updates are a separate repository setting (Settings -> Code
# security -> Dependabot alerts + Dependabot security updates). This file and its
# limit do not affect them; they keep opening PRs for known advisories.
#
# Dependency freshness is covered instead by `npm run audit:gate`, which audits the
# full tree including devDependencies, plus `.github/audit-allowlist.json` for the
# advisories that cannot be fixed, each with a `reviewBy` deadline.
#
# `schedule` stays because it is schema-required even with the limit at 0.
version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
    open-pull-requests-limit: 0

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
