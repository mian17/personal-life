services:
  note-service:
    build:
      context: .
      dockerfile: apps/note-service/Dockerfile
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: "3001"
      HOST: 0.0.0.0
      DB_PATH: /data/life.db
      # JWT-only auth (Task 10). note-service verifies tokens offline against the
      # IdP's JWKS. `iss` must equal the issuer the IdP mints with (the
      # browser-facing URL in .env), while the JWKS is fetched over the internal
      # compose network (no tailnet round-trip) — hence the two vars.
      IDP_ISSUER: ${IDP_ISSUER:-}
      IDP_JWKS_URL: ${NOTE_SERVICE_IDP_JWKS_URL:-http://idp:3003/jwks}
      # Shared ecosystem audience (SPEC-service-kernel token model): one token,
      # `aud: life-api`, accepted by all three resource services.
      NOTE_SERVICE_AUDIENCE: ${NOTE_SERVICE_AUDIENCE:-life-api}
      # Per-service read-through cache (fail-open). Injected here; .env unchanged.
      REDIS_URL: redis://redis-note:6379
      # Content-encryption master key (data-privacy chapter). 32 bytes base64:
      # generate with `openssl rand -base64 32` into the server's .env. Fail-fast
      # here; note-service also refuses to boot without it.
      NOTE_MASTER_KEY: ${NOTE_MASTER_KEY:?NOTE_MASTER_KEY is required (openssl rand -base64 32)}
    volumes:
      - ./apps/note-service/data:/data
    depends_on:
      redis-note:
        condition: service_healthy
    networks:
      - life
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/health/ready').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  tags-service:
    build:
      context: .
      dockerfile: apps/tags-service/Dockerfile
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: "3004"
      HOST: 0.0.0.0
      DB_PATH: /data/tags.db
      IDP_ISSUER: ${IDP_ISSUER:-}
      TAGS_IDP_JWKS_URL: ${TAGS_IDP_JWKS_URL:-http://idp:3003/jwks}
      TAGS_SERVICE_AUDIENCE: ${TAGS_SERVICE_AUDIENCE:-life-api}
      # Content-encryption master key (own custody, MAP M3). Fail-fast here;
      # the service also refuses to boot without it.
      TAGS_MASTER_KEY: ${TAGS_MASTER_KEY:?TAGS_MASTER_KEY is required (openssl rand -base64 32)}
      REDIS_URL: redis://redis-note:6379
    volumes:
      - ./apps/tags-service/data:/data
    depends_on:
      redis-note:
        condition: service_healthy
    networks:
      - life
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3004/health/ready').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  todo-service:
    build:
      context: .
      dockerfile: apps/todo-service/Dockerfile
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: "3005"
      HOST: 0.0.0.0
      DB_PATH: /data/todo.db
      IDP_ISSUER: ${IDP_ISSUER:-}
      TODO_IDP_JWKS_URL: ${TODO_IDP_JWKS_URL:-http://idp:3003/jwks}
      TODO_SERVICE_AUDIENCE: ${TODO_SERVICE_AUDIENCE:-life-api}
      # Content-encryption master key (own custody, MAP M3). Fail-fast here;
      # the service also refuses to boot without it.
      TODO_MASTER_KEY: ${TODO_MASTER_KEY:?TODO_MASTER_KEY is required (openssl rand -base64 32)}
      REDIS_URL: redis://redis-note:6379
    volumes:
      - ./apps/todo-service/data:/data
    depends_on:
      redis-note:
        condition: service_healthy
    networks:
      - life
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3005/health/ready').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  idp:
    build:
      context: .
      dockerfile: apps/idp/Dockerfile
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: "3003"
      HOST: 0.0.0.0
      DB_PATH: /data/idp.db
      # Browser-reachable issuer (set in .env): the public Tailscale Serve URL.
      # The app and IdP must be same-site for SameSite=Lax cookies/logout.
      IDP_ISSUER: ${IDP_ISSUER:-}
      OIDC_APP_CLIENT_ID: ${OIDC_APP_CLIENT_ID:-app}
      # Required in production; the IdP validates at boot and fails loudly
      # (no placeholder fallback) so a missing value is caught immediately.
      OIDC_APP_CLIENT_SECRET: ${OIDC_APP_CLIENT_SECRET:-}
      # Exact browser callback URL; must byte-match OIDC_APP_REDIRECT_URI on the app.
      OIDC_APP_REDIRECT_URIS: ${OIDC_APP_REDIRECT_URI:-}
      # Audience/resource mapping (defaults preserve note-service).
      OIDC_DEFAULT_RESOURCE: ${OIDC_DEFAULT_RESOURCE:-https://note-service}
      # Every registered resource maps to the shared ecosystem audience; each
      # service verifies `life-api` via its own *_SERVICE_AUDIENCE knob.
      OIDC_AUDIENCE_MAP: ${OIDC_AUDIENCE_MAP:-https://note-service=life-api,https://tags-service=life-api,https://todo-service=life-api}
      # Per-service read-through cache (fail-open). Injected here; .env unchanged.
      REDIS_URL: redis://redis-idp:6379
    ports:
      # Published on host loopback only so `tailscale serve` can proxy to it
      # (the IdP itself stays off the tailnet/LAN). See README "Auth model".
      - "127.0.0.1:3003:3003"
    volumes:
      - ./apps/idp/data:/data
    depends_on:
      redis-idp:
        condition: service_healthy
    networks:
      - life
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3003/health/ready').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: apps/app/Dockerfile
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: "3002"
      HOSTNAME: 0.0.0.0
      API_URL: http://note-service:3001
      # OIDC relying-party config (values from .env). The issuer must be the
      # browser-reachable URL; the app validates at boot and fails loudly.
      IDP_ISSUER: ${IDP_ISSUER:-}
      OIDC_APP_CLIENT_ID: ${OIDC_APP_CLIENT_ID:-app}
      OIDC_APP_CLIENT_SECRET: ${OIDC_APP_CLIENT_SECRET:-}
      # Must byte-match OIDC_APP_REDIRECT_URIS registered on the IdP.
      OIDC_APP_REDIRECT_URI: ${OIDC_APP_REDIRECT_URI:-}
      OIDC_APP_RESOURCE: ${OIDC_APP_RESOURCE:-https://note-service}
      # Session store + cross-replica refresh lock (fail-closed). Injected here;
      # .env unchanged. AOF + named volume so sessions survive restarts.
      REDIS_URL: redis://redis-app:6379
    ports:
      - "127.0.0.1:3002:3002"
    depends_on:
      note-service:
        condition: service_healthy
      idp:
        condition: service_healthy
      redis-app:
        condition: service_healthy
    networks:
      - life
    restart: unless-stopped

  # --- Redis (Task 6) ---------------------------------------------------------
  # One instance per service: app (session store, persisted) and idp/note
  # (read-through caches, unpersisted). Internal network only — NO published
  # host ports. See README "Auth model" and tasks/plan-redis.md decisions 2/6.
  redis-app:
    image: redis:8-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis-app-data:/data
    networks:
      - life
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  redis-idp:
    image: redis:8-alpine
    # Cache only. `--save ""` disables the image's default RDB snapshot points
    # (without it the cached argon2 hash would still land in /data/dump.rdb, a
    # second disk) and `--appendonly no` forces AOF off: nothing durable is
    # written. List form keeps the empty `--save` argument unambiguous.
    command:
      [
        "redis-server",
        "--save",
        "",
        "--appendonly",
        "no",
        "--maxmemory",
        "64mb",
        "--maxmemory-policy",
        "allkeys-lru",
      ]
    networks:
      - life
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  redis-note:
    image: redis:8-alpine
    # Cache only. `--save ""` + `--appendonly no` turn off both RDB and AOF: note
    # content must not hit a second disk, and the image's default snapshot points
    # would otherwise write it to /data/dump.rdb. See compose decision 6.
    command:
      [
        "redis-server",
        "--save",
        "",
        "--appendonly",
        "no",
        "--maxmemory",
        "64mb",
        "--maxmemory-policy",
        "allkeys-lru",
      ]
    networks:
      - life
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

networks:
  life:
    driver: bridge

volumes:
  # Sessions are state: AOF + named volume so they survive restarts/rebuilds.
  redis-app-data:
