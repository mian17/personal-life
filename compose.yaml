services:
  note-service:
    build:
      context: .
      dockerfile: apps/note-service/Dockerfile
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: "3001"
      HOST: 0.0.0.0
      DB_PATH: /data/life.db
    volumes:
      - ./apps/note-service/data:/data
    networks:
      - life
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('net').connect(3001,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  idp:
    build:
      context: .
      dockerfile: apps/idp/Dockerfile
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: "3003"
      HOST: 0.0.0.0
      DB_PATH: /data/idp.db
    volumes:
      - ./apps/idp/data:/data
    networks:
      - life
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('net').connect(3003,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: apps/app/Dockerfile
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: "3002"
      HOSTNAME: 0.0.0.0
      API_URL: http://note-service:3001
    ports:
      - "127.0.0.1:3002:3002"
    depends_on:
      note-service:
        condition: service_healthy
    networks:
      - life
    restart: unless-stopped

networks:
  life:
    driver: bridge
