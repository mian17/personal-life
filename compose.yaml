services:
  note-service:
    build:
      context: .
      dockerfile: apps/note-service/Dockerfile
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: "3001"
      HOST: 0.0.0.0
      DB_PATH: /data/life.db
      # JWT-only auth (Task 10). note-service verifies tokens offline against the
      # IdP's JWKS. `iss` must equal the issuer the IdP mints with (the
      # browser-facing URL in .env), while the JWKS is fetched over the internal
      # compose network (no tailnet round-trip) — hence the two vars.
      IDP_ISSUER: ${IDP_ISSUER:-}
      IDP_JWKS_URL: ${NOTE_SERVICE_IDP_JWKS_URL:-http://idp:3003/jwks}
      # Shared ecosystem audience (SPEC-service-kernel token model): one token,
      # `aud: life-api`, accepted by all three resource services.
      NOTE_SERVICE_AUDIENCE: ${NOTE_SERVICE_AUDIENCE:-life-api}
      # Per-service read-through cache (fail-open). Injected here; .env unchanged.
      REDIS_URL: redis://redis-note:6379
      # Content-encryption master key (data-privacy chapter). 32 bytes base64:
      # generate with `openssl rand -base64 32` into the server's .env. Fail-fast
      # here; note-service also refuses to boot without it.
      NOTE_MASTER_KEY: ${NOTE_MASTER_KEY:?NOTE_MASTER_KEY is required (openssl rand -base64 32)}
    volumes:
      - ./apps/note-service/data:/data
    depends_on:
      redis-note:
        condition: service_healthy
    networks:
      - life
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/health/ready').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  tags-service:
    build:
      context: .
      dockerfile: apps/tags-service/Dockerfile
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: "3004"
      HOST: 0.0.0.0
      DB_PATH: /data/tags.db
      IDP_ISSUER: ${IDP_ISSUER:-}
      TAGS_IDP_JWKS_URL: ${TAGS_IDP_JWKS_URL:-http://idp:3003/jwks}
      TAGS_SERVICE_AUDIENCE: ${TAGS_SERVICE_AUDIENCE:-life-api}
      # Content-encryption master key (own custody, MAP M3). Fail-fast here;
      # the service also refuses to boot without it.
      TAGS_MASTER_KEY: ${TAGS_MASTER_KEY:?TAGS_MASTER_KEY is required (openssl rand -base64 32)}
      REDIS_URL: redis://redis-tags:6379
    volumes:
      - ./apps/tags-service/data:/data
    depends_on:
      redis-tags:
        condition: service_healthy
    networks:
      - life
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3004/health/ready').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  todo-service:
    build:
      context: .
      dockerfile: apps/todo-service/Dockerfile
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: "3005"
      HOST: 0.0.0.0
      DB_PATH: /data/todo.db
      IDP_ISSUER: ${IDP_ISSUER:-}
      TODO_IDP_JWKS_URL: ${TODO_IDP_JWKS_URL:-http://idp:3003/jwks}
      TODO_SERVICE_AUDIENCE: ${TODO_SERVICE_AUDIENCE:-life-api}
      # Content-encryption master key (own custody, MAP M3). Fail-fast here;
      # the service also refuses to boot without it.
      TODO_MASTER_KEY: ${TODO_MASTER_KEY:?TODO_MASTER_KEY is required (openssl rand -base64 32)}
      # Reminder sweep (todo-due-repeat-notify). The VAPID pair is optional:
      # unset keeps the sweep off (it logs once) so the service still boots.
      TODO_TIMEZONE: ${TODO_TIMEZONE:-Asia/Ho_Chi_Minh}
      TODO_VAPID_PUBLIC_KEY: ${TODO_VAPID_PUBLIC_KEY:-}
      TODO_VAPID_PRIVATE_KEY: ${TODO_VAPID_PRIVATE_KEY:-}
      TODO_VAPID_SUBJECT: ${TODO_VAPID_SUBJECT:-mailto:admin@example.com}
      REDIS_URL: redis://redis-todo:6379
    volumes:
      - ./apps/todo-service/data:/data
    depends_on:
      redis-todo:
        condition: service_healthy
    networks:
      - life
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3005/health/ready').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  feedback-service:
    build:
      context: .
      dockerfile: apps/feedback-service/Dockerfile
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: "3008"
      HOST: 0.0.0.0
      # Postgres + RabbitMQ (feedback-infra). Compose injects the connection
      # strings over the internal network; .env keeps only the passwords.
      FEEDBACK_DB_URL: postgresql://feedback:${FEEDBACK_DB_PASSWORD}@postgres:5432/feedback
      RABBITMQ_URL: amqp://feedback:${RABBITMQ_PASSWORD}@rabbitmq:5672
      # JWT-only auth, same offline-JWKS pattern as note/tags/todo: `iss` must
      # equal the IdP's browser-facing issuer, while the JWKS is fetched over the
      # internal compose network.
      IDP_ISSUER: ${IDP_ISSUER:-}
      FEEDBACK_IDP_JWKS_URL: ${FEEDBACK_IDP_JWKS_URL:-http://idp:3003/jwks}
      FEEDBACK_SERVICE_AUDIENCE: ${FEEDBACK_SERVICE_AUDIENCE:-life-api}
      # Content-encryption master key (own custody, MAP M3). Fail-fast here;
      # the service also refuses to boot without it.
      FEEDBACK_MASTER_KEY: ${FEEDBACK_MASTER_KEY:?FEEDBACK_MASTER_KEY is required (openssl rand -base64 32)}
      # Per-service read-through cache (fail-open). Injected here; .env unchanged.
      REDIS_URL: redis://redis-feedback:6379
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis-feedback:
        condition: service_healthy
    networks:
      - life
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3008/health/ready').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  idp:
    build:
      context: .
      dockerfile: apps/idp/Dockerfile
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: "3003"
      HOST: 0.0.0.0
      DB_PATH: /data/idp.db
      # Browser-reachable issuer (set in .env): the public Tailscale Serve URL.
      # The app and IdP must be same-site for SameSite=Lax cookies/logout.
      IDP_ISSUER: ${IDP_ISSUER:-}
      OIDC_APP_CLIENT_ID: ${OIDC_APP_CLIENT_ID:-app}
      # Required in production; the IdP validates at boot and fails loudly
      # (no placeholder fallback) so a missing value is caught immediately.
      OIDC_APP_CLIENT_SECRET: ${OIDC_APP_CLIENT_SECRET:-}
      # Exact browser callback URL; must byte-match OIDC_APP_REDIRECT_URI on the app.
      OIDC_APP_REDIRECT_URIS: ${OIDC_APP_REDIRECT_URI:-}
      # Audience/resource mapping (defaults preserve note-service).
      OIDC_DEFAULT_RESOURCE: ${OIDC_DEFAULT_RESOURCE:-https://note-service}
      # Every registered resource maps to the shared ecosystem audience; each
      # service verifies `life-api` via its own *_SERVICE_AUDIENCE knob.
      OIDC_AUDIENCE_MAP: ${OIDC_AUDIENCE_MAP:-https://note-service=life-api,https://tags-service=life-api,https://todo-service=life-api}
      # Per-service read-through cache (fail-open). Injected here; .env unchanged.
      REDIS_URL: redis://redis-idp:6379
    ports:
      # Published on host loopback only so `tailscale serve` can proxy to it
      # (the IdP itself stays off the tailnet/LAN). See README "Auth model".
      - "127.0.0.1:3003:3003"
    volumes:
      - ./apps/idp/data:/data
    depends_on:
      redis-idp:
        condition: service_healthy
    networks:
      - life
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3003/health/ready').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: apps/app/Dockerfile
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: "3002"
      HOSTNAME: 0.0.0.0
      API_URL: http://note-service:3001
      # Ecosystem base URLs (SPEC-service-kernel transport contract). Without
      # these the BFF falls back to container-local loopback and every tag/todo
      # call dies inside the app container.
      TAGS_API_URL: http://tags-service:3004
      TODO_API_URL: http://todo-service:3005
      FEEDBACK_API_URL: http://feedback-service:3008
      # The app's fallback "today" zone, before the browser's `tz` cookie lands.
      # Must match the backend's TODO_TIMEZONE so SSR today agrees with storage.
      TODO_TIMEZONE: ${TODO_TIMEZONE:-Asia/Ho_Chi_Minh}
      # OIDC relying-party config (values from .env). The issuer must be the
      # browser-reachable URL; the app validates at boot and fails loudly.
      IDP_ISSUER: ${IDP_ISSUER:-}
      OIDC_APP_CLIENT_ID: ${OIDC_APP_CLIENT_ID:-app}
      OIDC_APP_CLIENT_SECRET: ${OIDC_APP_CLIENT_SECRET:-}
      # Must byte-match OIDC_APP_REDIRECT_URIS registered on the IdP.
      OIDC_APP_REDIRECT_URI: ${OIDC_APP_REDIRECT_URI:-}
      OIDC_APP_RESOURCE: ${OIDC_APP_RESOURCE:-https://note-service}
      # Session store + cross-replica refresh lock (fail-closed). Injected here;
      # .env unchanged. AOF + named volume so sessions survive restarts.
      REDIS_URL: redis://redis-app:6379
    ports:
      - "127.0.0.1:3002:3002"
    depends_on:
      note-service:
        condition: service_healthy
      tags-service:
        condition: service_healthy
      todo-service:
        condition: service_healthy
      feedback-service:
        condition: service_healthy
      idp:
        condition: service_healthy
      redis-app:
        condition: service_healthy
    networks:
      - life
    restart: unless-stopped

  # --- Redis (Task 6) ---------------------------------------------------------
  # One instance per service (app, idp, note, tags, todo): app is the persisted
  # session store; the four others are unpersisted read-through caches. Internal
  # network only — NO published host ports. See README "Auth model" and
  # tasks/plan-redis.md decisions 2/6.
  redis-app:
    image: redis:8-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis-app-data:/data
    networks:
      - life
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  redis-idp:
    image: redis:8-alpine
    # Cache only. `--save ""` disables the image's default RDB snapshot points
    # (without it the cached argon2 hash would still land in /data/dump.rdb, a
    # second disk) and `--appendonly no` forces AOF off: nothing durable is
    # written. List form keeps the empty `--save` argument unambiguous.
    command:
      [
        "redis-server",
        "--save",
        "",
        "--appendonly",
        "no",
        "--maxmemory",
        "64mb",
        "--maxmemory-policy",
        "allkeys-lru",
      ]
    networks:
      - life
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  redis-note:
    image: redis:8-alpine
    # Cache only. `--save ""` + `--appendonly no` turn off both RDB and AOF: note
    # content must not hit a second disk, and the image's default snapshot points
    # would otherwise write it to /data/dump.rdb. See compose decision 6.
    command:
      [
        "redis-server",
        "--save",
        "",
        "--appendonly",
        "no",
        "--maxmemory",
        "64mb",
        "--maxmemory-policy",
        "allkeys-lru",
      ]
    networks:
      - life
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  redis-tags:
    image: redis:8-alpine
    # Cache only, owned by tags-service (one instance per service, intent decision 3).
    # `--save ""` + `--appendonly no` turn off both RDB and AOF: tag ciphertext must
    # not hit a second disk, and the image's default snapshot points would otherwise
    # write it to /data/dump.rdb. See compose decision 6.
    command:
      [
        "redis-server",
        "--save",
        "",
        "--appendonly",
        "no",
        "--maxmemory",
        "64mb",
        "--maxmemory-policy",
        "allkeys-lru",
      ]
    networks:
      - life
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  redis-todo:
    image: redis:8-alpine
    # Cache only, owned by todo-service (one instance per service, intent decision 3).
    # `--save ""` + `--appendonly no` turn off both RDB and AOF: todo ciphertext must
    # not hit a second disk, and the image's default snapshot points would otherwise
    # write it to /data/dump.rdb. See compose decision 6.
    command:
      [
        "redis-server",
        "--save",
        "",
        "--appendonly",
        "no",
        "--maxmemory",
        "64mb",
        "--maxmemory-policy",
        "allkeys-lru",
      ]
    networks:
      - life
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # --- feedback infra (feedback-infra chapter) --------------------------------
  # `postgres` + `rabbitmq` publish their main ports on host loopback only so the
  # host-run dev service (3108) can reach them — the same posture as `app`/`idp`.
  # Production uses the internal compose network (`postgres:5432`, `rabbitmq:5672`).
  # `redis-feedback` stays internal-only, like the five Redis instances above.
  # See docs/specs/SPEC-feedback-infra.md "compose.yaml additions".
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: feedback
      POSTGRES_USER: feedback
      # Fail-fast, like NOTE_MASTER_KEY: compose refuses to start with no password.
      POSTGRES_PASSWORD: ${FEEDBACK_DB_PASSWORD:?FEEDBACK_DB_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - life
    ports:
      # Host loopback only: the host-run dev service (3108) reaches Postgres here.
      # Production uses the internal compose network (`postgres:5432`).
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U feedback -d feedback"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4.1-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-feedback}
      # Fail-fast, like POSTGRES_PASSWORD.
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - life
    ports:
      # Host loopback only: the host-run dev service (3108) reaches the broker here.
      # Production uses the internal compose network (`rabbitmq:5672`).
      - "127.0.0.1:5672:5672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  redis-feedback:
    image: redis:8-alpine
    # Cache only, owned by feedback-service (one instance per service, intent
    # decision 3, lesson 0011). `--save ""` + `--appendonly no` turn off both RDB
    # and AOF: feedback ciphertext must not hit a second disk, and the image's
    # default snapshot points would otherwise write it to /data/dump.rdb.
    command:
      [
        "redis-server",
        "--save",
        "",
        "--appendonly",
        "no",
        "--maxmemory",
        "64mb",
        "--maxmemory-policy",
        "allkeys-lru",
      ]
    volumes:
      - redis-feedback-data:/data
    networks:
      - life
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

networks:
  life:
    driver: bridge

volumes:
  # Sessions are state: AOF + named volume so they survive restarts/rebuilds.
  redis-app-data:
  postgres-data:
  rabbitmq-data:
  redis-feedback-data:
