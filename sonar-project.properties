# Without this the scanner walks the repo and builds a TypeScript program for every
# tsconfig it finds (25 of them: *.test.json, *.build.json, .next/types). Each program
# re-resolves node_modules typings, which exhausts the Node bridge heap.
sonar.typescript.tsconfigPaths=apps/app/tsconfig.json,apps/feedback-service/tsconfig.json,apps/idp/tsconfig.json,apps/meal-service/tsconfig.json,apps/note-service/tsconfig.json,apps/pomodoro/tsconfig.json,apps/tags-service/tsconfig.json,apps/todo-service/tsconfig.json,packages/app-kit/tsconfig.json,packages/cache/tsconfig.json,packages/crypto/tsconfig.json,packages/db/tsconfig.json,packages/nutrition/tsconfig.json,packages/ops/tsconfig.json,packages/service-kit/tsconfig.json,packages/shared/tsconfig.json,packages/ui/tsconfig.json

# Default heap is derived from available RAM at ~4 GB and dies on this monorepo.
# Host has 23 GB; 6 GB leaves room for the runner, Docker VM and the IDE.
# Coverage. SonarQube reported 0.0% for a long time because no report was ever
# produced: the scanner had nothing to ingest, so every line counted as uncovered
# even though the jest suites already covered most of them. `npm run test:coverage`
# writes one merged, repository-relative lcov here (see scripts/coverage.mjs) — the
# paths must stay relative to this directory or the scanner silently drops every
# record for failing to match an indexed file.
sonar.javascript.lcov.reportPaths=.coverage/lcov.info
sonar.javascript.node.maxspace=6144

# Coverage scope. `sonar.coverage.exclusions` keeps a file in the analysis — its
# issues still count — but out of the coverage ratio. Two groups, both dev-only:
#  - apps/idp/scripts/**: interactive helpers that drive a browser against a live
#    IdP (`oidc-dance`, `seed-user`, `verify-jwks`, `sign-demo-token`), so no
#    injected suite can reach them;
#  - scripts/**/*.py: the duplication report is python, and this repo has no
#    python test or coverage tooling (jest and `node --test` cannot instrument it).
# Everything else stays measured: a source file with no suite gets a suite.
sonar.coverage.exclusions=apps/idp/scripts/**,scripts/**/*.py

# The scanner assumes compatibility with Python 3.10-3.14 unless told otherwise
# (a warning on every run). The repo has one script, scripts/duplication-report.py,
# and no interpreter pin: pin the upper bound so the assumption is stated, and so
# version-specific rules stop guessing at which versions the code must run on.
sonar.python.version=3.14
