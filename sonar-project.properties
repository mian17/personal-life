# Two analysers read this file. The CI scan (`.github/workflows/tests.yml`) runs
# against SonarCloud; the local SonarQube container reads the same file for the
# rule keys and exclusions the edit-time / pre-commit gate applies. The key below
# is the LOCAL project — that gate refuses to judge anything whose key is not this
# exact value — so the CI step overrides the identity on the command line
# (`-Dsonar.projectKey=mian17_personal-life`) instead of editing it here.
sonar.organization=mian17
sonar.projectKey=personal-life
sonar.projectName=personal-life
# SonarCloud's analysis-scope UX analyzes the whole project and ignores
# sonar.sources, sonar.tests and sonar.test.inclusions — it warns on every run
# that they are "configured but have no effect" — so all three were removed from
# this file and sonar.exclusions is the only lever that restricts what Cloud
# measures. Beyond the build artifacts, docs/** (HTML prototypes plus token
# JSON) is documentation, not product code; the test-file shapes and the whole
# test trees are excluded by path because Cloud classifies no file as a test
# without sonar.test.inclusions, and a test file left in the analysis counts as
# product code in the coverage denominator.
#
# With those three properties gone, a hand-run scan of this project by the local
# SonarQube server takes the checkout root as its source: it now indexes
# `.pi/worktrees`, `openwiki/` and anything else the exclusion list does not
# name, instead of apps,packages,scripts. `docs/**` stays out only because the
# exclusions line below still names it.
#
# The pi/kendex edit-time gate is unaffected. It hardcodes its measured roots
# (apps/, packages/, scripts/) and reads only sonar.projectKey from this file,
# so the properties removed above were never part of its scope. That behaviour
# lives in `.pi/kendex/hooks/sonar-check.mjs`.
sonar.exclusions=**/node_modules/**,**/dist/**,**/.next/**,**/coverage/**,**/*.d.ts,**/public/**,**/*.tsbuildinfo,docs/**,.coverage/**,**/test-results/**,backup/**,**/*.test.ts,**/*.test.tsx,**/*.test.js,**/*.test.mjs,**/*.spec.ts,**/*.spec.tsx,**/*e2e-spec.ts,**/test/**,**/tests/**,**/__tests__/**,**/fixtures/**

# Parallel conformance tests are duplication by design. Every service test/ has a
# health.e2e-spec.ts that proves the same shared service-kernel health dialect (three
# routes, `{status:'ok'}`, garbage bearer ignored), so those assertions are identical
# across six services on purpose — that is the point of a conformance suite. The only
# way to remove it is a shared test helper, which cannot live in packages/*/src
# without shipping test support as product code, or in packages/*/test without a
# cross-package import jest and Sonar both resolve badly. Accept the duplication for
# test files and keep product code measured; see docs/lessons/0016.
sonar.cpd.exclusions=**/test/**,**/tests/**,**/__tests__/**

# Two rules are excluded per file, not silenced line by line with `// NOSONAR`.
#  - `typescript:S1135` cannot tell a note from a task. Every comment listed below
#    records a deferred design decision (`SPEC-todo-origin` keeps the producer's key
#    off the wire, the grant is written before an intent is enqueued, the toggle flag
#    is not the enforcement point), so all 15 of its findings are false positives by
#    construction rather than by argument.
#  - `typescript:S9382` treats sequential delivery as waste. Here it is the
#    correctness requirement: one intent at a time so a single failing row cannot
#    abort the batch, and the poller advances its cursor only after the broker
#    confirms, so parallelising any of these sites loses events. The per-site verdicts
#    are recorded in docs/lessons/0031-await-in-loop-is-a-correctness-decision.md.
# The patterns are the exact files that carry those findings, deliberately not
# `**/*.ts`: a genuine await-in-loop bug in any other file, a TODO left in any other
# file, and every other rule in these files all stay fully measured. A moved file
# re-surfaces its finding, which is the safe direction.
sonar.issue.ignore.multicriteria=t1,t2,t3,t4,t5,t6,t7,t8,t9,t10,t11,t12,t13,t14,t15,t16,t17,t18,t19,t20,t21,t22,t23,t24,t25,t26,a1,a2,a3,a4
