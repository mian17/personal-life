sonar.projectKey=personal-life
sonar.projectName=personal-life
sonar.sources=apps,packages,scripts
sonar.exclusions=**/node_modules/**,**/dist/**,**/.next/**,**/coverage/**,**/*.d.ts,**/public/**,**/*.tsbuildinfo
# `scripts` is scanned as source, but it also holds receiver.test.mjs — without it
# listed here that test file matches the inclusions below yet has no test base
# directory, so the scanner falls back to indexing it as product source.
sonar.tests=apps,packages,scripts
# Every test-shaped file must be matched here or the scanner treats it as
# product source (that is why it asked for coverage of test/e2e/stack.ts).
# Bare `*.spec.ts` does not match the repo's `*.e2e-spec.ts` naming, so the
# `*e2e-spec` pattern is load-bearing. Whole test/ directories are included too:
# helpers (harness, fake-*, stubs, global-setup) never end in .test/.spec.
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.test.js,**/*.test.mjs,**/*.spec.ts,**/*.spec.tsx,**/*e2e-spec.ts,**/test/**,**/tests/**,**/__tests__/**,**/fixtures/**

# Parallel conformance tests are duplication by design. Every service test/ has a
# health.e2e-spec.ts that proves the same shared service-kernel health dialect (three
# routes, `{status:'ok'}`, garbage bearer ignored), so those assertions are identical
# across six services on purpose — that is the point of a conformance suite. The only
# way to remove it is a shared test helper, which cannot live in packages/*/src
# without shipping test support as product code, or in packages/*/test without a
# cross-package import jest and Sonar both resolve badly. Accept the duplication for
# test files and keep product code measured; see docs/lessons/0016.
sonar.cpd.exclusions=**/test/**,**/tests/**,**/__tests__/**

# Without this the scanner walks the repo and builds a TypeScript program for every
# tsconfig it finds (25 of them: *.test.json, *.build.json, .next/types). Each program
# re-resolves node_modules typings, which exhausts the Node bridge heap.
sonar.typescript.tsconfigPaths=apps/app/tsconfig.json,apps/feedback-service/tsconfig.json,apps/idp/tsconfig.json,apps/meal-service/tsconfig.json,apps/note-service/tsconfig.json,apps/pomodoro/tsconfig.json,apps/tags-service/tsconfig.json,apps/todo-service/tsconfig.json,packages/app-kit/tsconfig.json,packages/cache/tsconfig.json,packages/crypto/tsconfig.json,packages/db/tsconfig.json,packages/nutrition/tsconfig.json,packages/ops/tsconfig.json,packages/shared/tsconfig.json,packages/ui/tsconfig.json

# Default heap is derived from available RAM at ~4 GB and dies on this monorepo.
# Host has 23 GB; 6 GB leaves room for the runner, Docker VM and the IDE.
sonar.javascript.node.maxspace=6144
